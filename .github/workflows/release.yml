name: release

# 推送 v* 标签时构建安装包并发布到 GitHub Releases。
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 release 所需

jobs:
  release:
    runs-on: windows-latest
    # fetch-runtime 的 npm install 解析 dsh 浮动依赖树，默认 ~2GB 堆会 OOM（2026-08-27 实踩）
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 运行时按 dsh 版本+脚本哈希缓存：绝大多数发版不动 dsh，命中即跳过 ~20 分钟的
      # npm install（CI 上解析 dsh 浮动依赖树是整条流水线最慢的一步）
      - name: Compute runtime cache key
        id: rtkey
        shell: pwsh
        run: |
          $dsh = (Select-String -Path scripts/fetch-runtime.ps1 -Pattern "DshVersion\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          $hash = (Get-FileHash scripts/fetch-runtime.ps1, scripts/prune-runtime.ps1 -Algorithm SHA256 | ForEach-Object { $_.Hash.Substring(0, 8) }) -join '-'
          "key=rt-$dsh-$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Restore bundled runtime cache
        id: rtcache
        uses: actions/cache@v4
        with:
          path: src-tauri/runtime/windows-x64
          key: ${{ steps.rtkey.outputs.key }}

      - name: Fetch bundled runtime (node + dsh)
        if: steps.rtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: pnpm tauri build

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # 写到安装包同目录：Out-File 默认落工作区根，release files glob 会匹配不到
          $out = Join-Path $exe.DirectoryName "$($exe.Name).sha256"
          "$hash  $($exe.Name)" | Out-File -Encoding ascii $out
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sha256
          generate_release_notes: true
