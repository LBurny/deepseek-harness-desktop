name: build

# 分支构建检查 + 运行时缓存预热 + 手动触发。v* 标签的构建发布由 release.yml 负责
# （同链路重复且会与 release 撞出双红/双绿噪音），不再在 tag 上跑。
#
# 【为什么必须在 main 上跑】Actions 缓存按 ref 隔离：tag 触发的 run 只能读「当前 tag
# / 默认分支」的缓存，tag run 存的缓存对下一个 tag 永远不可见（0.4.0→0.4.1 实测：key
# 相同仍 miss，~20 分钟 npm install 重跑，且 0.4.0 那次的 1h09 同因）。所以 rt 缓存
# 必须由 main 上的本 workflow 预热进默认分支作用域，release 的 tag run 才能命中。
# 发版前注意：dsh 版本变了（key 变）时先推 main 让本流程回填缓存，再打 tag。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # 多平台预留：启用下面两行前，需要
        # 1) 实现 src-tauri/src/platform/{macos,linux}.rs（替换 mod.rs 中的 compile_error! 占位）
        # 2) scripts/fetch-runtime 增加对应平台 Node 运行时下载（resources/runtime/darwin-arm64 等）
        # 3) tauri.conf.json bundle.targets 增加 dmg/appimage
        # - macos-latest
        # - ubuntu-latest

    runs-on: ${{ matrix.os }}
    # fetch-runtime 的 npm install 解析 dsh 浮动依赖树，默认 ~2GB 堆会 OOM（2026-08-27 实踩）
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 运行时按 dsh 版本+脚本哈希缓存（与 release.yml 同 key），命中跳过 npm install
      - name: Compute runtime cache key
        id: rtkey
        shell: pwsh
        run: |
          $dsh = (Select-String -Path scripts/fetch-runtime.ps1 -Pattern "DshVersion\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          $hash = (Get-FileHash scripts/fetch-runtime.ps1, scripts/prune-runtime.ps1 -Algorithm SHA256 | ForEach-Object { $_.Hash.Substring(0, 8) }) -join '-'
          "key=rt-$dsh-$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Restore bundled runtime cache
        id: rtcache
        uses: actions/cache@v4
        with:
          path: src-tauri/runtime/windows-x64
          key: ${{ steps.rtkey.outputs.key }}

      - name: Fetch bundled runtime (node + dsh)
        if: steps.rtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: pnpm tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dshdesktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/nsis/*.exe
