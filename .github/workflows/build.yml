name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # 多平台预留：启用下面两行前，需要
        # 1) 实现 src-tauri/src/platform/{macos,linux}.rs（替换 mod.rs 中的 compile_error! 占位）
        # 2) scripts/fetch-runtime 增加对应平台 Node 运行时下载（resources/runtime/darwin-arm64 等）
        # 3) tauri.conf.json bundle.targets 增加 dmg/appimage
        # - macos-latest
        # - ubuntu-latest

    runs-on: ${{ matrix.os }}
    # fetch-runtime 的 npm install 解析 dsh 浮动依赖树，默认 ~2GB 堆会 OOM（2026-08-27 实踩）
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled runtime (node + dsh)
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: pnpm tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dshdesktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/nsis/*.exe
