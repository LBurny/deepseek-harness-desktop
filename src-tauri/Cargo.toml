[package]
name = "dshdesktop"
version = "0.5.7"
edition = "2021"
description = "Desktop shell for deepseek-harness (dsh)"
repository = "https://github.com/LBurny/deepseek-harness-desktop"

[lib]
name = "dshdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs = "6"
thiserror = "2"
fs_extra = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 远程代理对大体积文本资产（插件 bundle/SPA JS）做 gzip：dsh 服务端不压缩。
# 版本与 zip 传递依赖同树（flate2 1.1，miniz_oxide 纯 Rust，不新增编译单元）
flate2 = "1"
regex = "1"
futures = "0.3"
url = "2"
tokio-tungstenite = "0.26"
serde_yaml = "0.9"
toml = "0.8"
axum = { version = "0.8", features = ["ws"] }
rand = "0.8"
qrcode = "0.14"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# WinRT toast 原生互操作（协议激活 toast 需要 activationType/launch 属性，
# tauri-winrt-notification 不暴露）——版本与树内一致，不新增编译单元
windows = { version = "0.61", features = [
    "Foundation_Collections",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# upstream_contract 契约套件直接使用的库（与主依赖同版本，避免重复构建）
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(windows)'.dev-dependencies]
# 锚定上游 disable() 对不存在注册表值的行为（commands.rs 测试）
auto-launch = "0.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_StationsAndDesktops",
] }
